services:
  site:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"

    environment:
      # Bu iki değer .env dosyasından okunur — compose dosyasına YAZILMAZ,
      # çünkü compose.yaml versiyon kontrolüne girer.
      ADMIN_PAROLA_HASH: ${ADMIN_PAROLA_HASH:?ADMIN_PAROLA_HASH tanimli degil - once "npm run parola" calistirin}
      OTURUM_ANAHTARI: ${OTURUM_ANAHTARI:?OTURUM_ANAHTARI tanimli degil - once "npm run parola" calistirin}
      SITE_URL: ${SITE_URL:-https://basariinsaat.com}

    volumes:
      # ---------------------------------------------------------------
      # BU SATIR KRITIK.
      # Konteyner ici dosya sistemi her `docker compose up --build` ile
      # sifirlanir. Volume baglanmazsa TUM projeler, mesajlar ve yuklenen
      # fotograflar her guncellemede silinir.
      #
      # Tek klasor: /app/veri icinde hem basari.db hem uploads/ duruyor
      # (bkz. Dockerfile). Boylece ayni yapilandirma Railway, Render ve
      # Fly.io'da da calisir - onlar servis basina tek disk veriyor.
      # ---------------------------------------------------------------
      - basari-veri:/app/veri

volumes:
  basari-veri:
