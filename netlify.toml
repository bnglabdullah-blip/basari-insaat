# Netlify dagitimi.
#
# Ortam degiskenleri (Netlify panelinden girilir, buraya YAZILMAZ):
#   SUPABASE_URL                 https://bkpxbdpsgwauzrtbamce.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    RLS'i bypass eder, tam yetkili
#   OTURUM_ANAHTARI              oturum cerezini imzalar
#   SITE_URL                     https://basariyapi.com
#
# ADMIN_PAROLA_HASH burada YOK ve olmamali: parola ozeti artik `ayarlar`
# tablosunda. lib/auth.ts gecerliHash() once veritabanina baktigi icin
# degisken tanimlansa bile okunmazdi. Panelden parola degistirmek yeni ozeti
# ayni satira yazar; baska bir yerde saklanan kopya yok.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # package.json'daki Next 16 / React 19 zinciriyle uyumlu LTS.
  NODE_VERSION = "22"

# Next.js calisma zamani: server component'leri, action'lari ve ISR'i
# Netlify fonksiyonlarina cevirir. Netlify Next projelerinde bunu otomatik
# da kurar; acikca yazmak surumun neye bagli oldugunu gorunur kilar.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Eski *.netlify.app adresini asil alan adina yollar.
#
# Neden gerekli: iki adres de ayni icerigi 200 ile donerse arama motorlari
# icin cift icerik olusur ve siralama ikiye bolunur. Ayrica netlify.app
# Turk Telekom'un Guvenli Internet profilinde engelli; oraya dusen bir
# ziyaretci siteyi hic goremez.
#
# from tam URL yazildigi icin kural yalnizca O ana bilgisayar adina uygulanir.
# Dagitim onizlemeleri (<id>--basari-yapi.netlify.app) eslesmez, calismaya
# devam eder; yeni surumleri yayina almadan once test edebilelim diye onemli.
#
# force = true olmasa statik dosyalar kuraldan once gelir ve yonlendirme
# yalnizca 404'lerde calisirdi.
[[redirects]]
  from = "https://basari-yapi.netlify.app/*"
  to = "https://basariyapi.com/:splat"
  status = 301
  force = true
